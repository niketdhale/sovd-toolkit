# DID catalog for the body control module (bcm) mock/demo entity.
# Per-ECU-software-version, kept separate from vehicle topology (see
# docs/DESIGN.md's "DID catalog" architectural decision).
data:
  - id: vin
    did: 0xF190
    type: string
    length: 17
    access: read

  - id: battery_voltage
    did: 0x010A
    type: float
    encoding: { bytes: 2, endian: big, scale: 0.001, unit: V }
    access: read

  - id: door_lock_state
    did: 0x0200
    type: enum
    values: { 0: unlocked, 1: locked, 2: deadlocked }
    access: read_write
    io_control: true

  # docs/reviews/round-1.md Task 7: the only other read_write item here
  # (door_lock_state) is an enum, so the numeric out-of-range/negative
  # encode() path (test_core.cpp's test_catalog_encode_float_*) and the
  # scaled-number <input type=number> widget in DataTable.vue were never
  # exercised end to end through a real HTTP PUT, only via direct
  # Catalog::encode() unit tests. A courtesy-light shutoff delay is a
  # plausible real BCM calibration value -- 0-255s in a single byte.
  - id: courtesy_light_delay
    did: 0x0210
    type: float
    encoding: { bytes: 1, endian: big, scale: 1, unit: s }
    access: read_write

operations:
  - id: self_test
    routine_id: 0x0203
    requires_session: extended
    async: true
