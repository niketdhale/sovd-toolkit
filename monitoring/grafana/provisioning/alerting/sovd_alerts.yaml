apiVersion: 1

# Grafana unified alerting provisioning (Grafana OSS, no plugin needed --
# native to the stack CLAUDE.md already targets). Drop this file into
# /etc/grafana/provisioning/alerting/ on the Grafana instance that already
# reads from InfluxDB. Replace <INFLUXDB_DATASOURCE_UID> with the uid of the
# existing datasource (Settings -> Data sources -> InfluxDB -> uid in the URL).
#
# The two signatures are exactly the two named in CLAUDE.md Phase 3:
#   - lock_release_mismatch: a client released with the wrong lock_id --
#     either a bug or a client probing for another tester's lock.
#   - repeated lock_denied on one entity: a client hammering a lock it
#     can't get, instead of backing off (CLAUDE.md client config already
#     excludes 423 from the SDK's own retry policy for this reason).
groups:
  - orgId: 1
    name: sovd-security
    folder: SOVD
    interval: 1m
    rules:
      - uid: sovd-lock-release-mismatch
        title: "SOVD: lock release mismatch"
        condition: C
        for: 0s
        labels:
          severity: high
        annotations:
          summary: "A client released a lock with the wrong lock_id on {{ $labels.entity }}"
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: <INFLUXDB_DATASOURCE_UID>
            model:
              rawQuery: true
              query: >-
                SELECT count("correlation_id") FROM sovd_events
                WHERE event = 'lock_release_mismatch' AND $timeFilter
              resultFormat: time_series
          - refId: C
            datasourceUid: "-100"
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }

      - uid: sovd-repeated-lock-denied
        title: "SOVD: repeated lock_denied on one entity"
        condition: C
        for: 0s
        labels:
          severity: medium
        annotations:
          summary: "{{ $labels.entity }} saw more than 5 lock_denied in 5 minutes -- contention or a misbehaving client"
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: <INFLUXDB_DATASOURCE_UID>
            model:
              rawQuery: true
              query: >-
                SELECT count("correlation_id") FROM sovd_events
                WHERE event = 'lock_denied' AND $timeFilter GROUP BY entity
              resultFormat: time_series
          - refId: C
            datasourceUid: "-100"
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [5] }
